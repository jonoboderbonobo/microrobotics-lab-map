  description: "Hong Kong Centre for Cerebro-cardiovascular Health Engineering\n\n\
    \\Be global hub for interdisciplinary cerebro-cardiovascular health engineering\
    \ research collaboration\n\nConverging global experts in engineering, science,\
    \ medicine, and law for impactful research in human health\n\n\nMISSION FOR HEALTH\
    \ ;  PASSION FOR INNOVATION\n\nCardiovascular disease (CVD) is the world’s leading\
    \ cause of morbidity and mortality as well as the health industry’s most costly\
    \ disease for treatment. Yet, despite recent advances in its treatment, more effective\
    \ and accessible ways to tackle CVDs remain to be discovered. Hong Kong Centre\
    \ for Cerebro-cardiovascular Health Engineering (COCHE) is taking on the challenge\
    \ to develop new ways to treat CVD with innovative technologies allowing early\
    \ prediction and intervention, so people can stay a step ahead of the disease.\
    \ These technologies can also reduce the human cost, as well as alleviate both\
    \ the financial and social burden, on the healthcare system.\n\n​\n\nIn collaboration\
    \ with the University of Oxford and the Karolinska Institutet, Hong Kong Center\
    \ for Cerebro-cardiovascular Health Engineering (COCHE) was established under\
    \ City University of Hong Kong in 2020. The COCHE, supported financially by Innovation\
    \ and Technology Commission (ITC), was admitted to Inno-Health cluster of InnoHK\
    \ Programme which is a major R&D initiative of the Hong Kong Special Administrative\
    \ Region Government. We are developing flexible sensing, biomedical and molecular\
    \ imaging, nano-biosensing, and AI in health with the focus on innovative wearables\
    \ that collect key vital signs, including but not limited to continuous blood\
    \ pressure and electrocardiogram signals on an unobtrusive and real-time basis.\
    \ The collected data is transmitted for further analysis and integration with\
    \ other biomarkers, paving the way for the early detection and diagnosis of possible\
    \ acute cerebro-cardiovascular diseases.\n\n\n1 \tUncovering rare inherent resistant\
    \ single cells through an automatic microfluidic cell shower device to investigate\
