# Source of truth for the microrobotics lab map.
#
# Sorted alphabetically by `id`. `id` is a stable slug and is never edited once
# assigned -- it is the join key across git history.
#
# `color` is NOT a field here: it is derived from `category` in taxonomy.py.
# `description` is the group's own blurb and IS rendered into the uMap popup.
# `notes` is private assessment and is NEVER rendered.
#
# To add a lab: append an entry, set lat/lon to null, run `python build.py`.
# To add a campus outline: find it on openstreetmap.org, click the shape, and
# copy the id from the URL into `osm` as e.g. `way/104393803`. Leave it null
# for a marker without a polygon.

- id: ethz-msrl
  name: Multi-Scale Robotics Lab (MSRL)
  pi: Bradley J. Nelson
  institution: ETH Zürich
  city: Zürich
  country: CH
  lat: 47.377731
  lon: 8.546639
  osm: null
  url: https://msrl.ethz.ch/the-lab.html
  people_url: null
  category: micro-robotics
  application: [medical, fundamental]
  min_dim_um: null
  onboard_power: false
  institution_type: university
  relevance: 5
  status: watch
  description: >
    The Multi-Scale Robotics Lab (MSRL) pursues a dynamic research program that
    maintains a strong robotics research focus on several emerging areas of
    science and technology. A major component of the MSRL research leverages
    advanced robotics for creating intelligent machines that operate at micron
    and nanometer scales. MSRL research develops the tools and processes
    required to fabricate and assemble micron sized robots and nanometer scale
    robotic components. Many of these systems are used for robotic exploration
    within biomedical and biological domains.

    The MSRL pursues a balanced agenda between fundamental and applied
    research. The lab consistently publishes highly cited papers in top
    journals while also driving significant industrial interactions. The
    ground breaking technologies developed at MSRL have also led to the
    formation of several startup companies.
  notes: >
    Largest and most visible group in the field, and the main source of the
    "microrobot" terminology this map is trying to be precise about. Most
    systems are externally actuated, so by the strict criterion this is closer
    to a material lab -- but the systems-level ambition and the startup track
    record justify micro-robotics. Worth pinning down min_dim_um for their
    smallest genuinely untethered device.

