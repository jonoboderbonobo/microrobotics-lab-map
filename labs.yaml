  institution_type: university
  relevance: 1
  status: watch
  description: "B CUBE - Center for Molecular Bioengineering at TUD Dresden University\
    \ of Technology is part of the Center for Molecular and Cellular Bioengineering\
    \ (CMCB) and focuses on the investigation of natural phenomena across scales and\
    \ translates the ensuing knowledge into innovative materials and technologies\
    \ thereby building bridges between Life Sciences and Engineering Sciences. \n\n\
    \nMission\nTranslate natural phenomena into innovative materials and systems\n\
    \nNature offers an enormous arsenal of functional systems and properties that\
    \ could answer a wide range of unmet technological needs. B CUBE researchers aim\
    \ to capture potentially useful natural phenomena, to elucidate them on a multi-scale\
    \ mechanistic level, and translate these findings into synthetic material using\
    \ biologically inspired design concepts.\nProcure the foundations of human existence\
    \ for the future\n\nThe diminishing of non-renewable resources and the loss of\
    \ natural habitats has resulted in the urgent need to develop energy-efficient\
    \ and renewable technologies as quickly as possible. In this respect, materials\
    \ are of central importance, as their properties (such as adhesion, friction,\
    \ transport properties etc.) determine the efficiency of virtually all systems.\
    \ The most efficient systems of all are found in nature. In addition, living matter\
    \ demonstrates a range of properties that still have not been successfully incorporated\
    \ into modern synthetic materials, such as the ability to adapt or regenerate\
    \ functionality. The aim is thus to make use of the advances in molecular biology\
    \ in order to investigate living structures more intensely, and translate the\
    \ ensuing knowledge into innovative methods, materials and technologies.\nProviding\
    \ favorable conditions for innovation\n\nB CUBE unites complementary research\
    \ approaches and methodologies under one roof. The question of how to reproduce\
    \ natural phenomena synthetically is tackled in an interdisciplinary way – incorporating\
    \ biology, nanobiotechnology and engineering. This transdisciplinary research\
    \ space is implemented within a core-shell-structure. While professoral research\
    \ groups permanently represent and shape the main research areas, creativity of\
    \ international junior scientists is promoted and used as „innovation motor“.\
    \ Being embedded in strong partnership network of established Dresden research\
    \ institutes, B CUBE offers its high-profile scientists the most favorable conditions\
    \ for innovation as well as a high degree of freedom and self-responsibility.\
    \ The activities of all B CUBE research groups are supported by dedicated technology\
    \ platforms. This raises the efficiency of the groups in their core fields, ensures\
    \ the highest quality and reduces the financial and administrative load of each\
    \ group.\n\n\n\n\nAbout Dr. Mariana Medina-Sánchez\n\nMariana Medina-Sánchez holds\
    \ a Master’s degree in Nanotechnology. In 2013, she graduated with a PhD in Biotechnology\
    \ from the Autonomous University of Barcelona, Spain. She moved to Dresden in\
    \ 2014 and joined the Institute for Integrative Nanosciences (IIN) at the Leibniz\
    \ Institute for Solid State and Materials Research Dresden (IFW) as a postdoctoral\
    \ researcher. Her work focused on sperm-carrying micromotors and ultracompact\
    \ rolled-up biosensors. Since 2016, she is a research group leader at the IIN\
    \ and IFW. Her group “Micro- and Nanobiomedical Engineering” specializes in medical\
    \ microrobotics and biosensing microfluidic platforms. In 2020 her research was\
    \ funded by the competitive European Research Council Starting Grant.\n\nAbout\
    \ B CUBE – Center for Molecular Bioengineering\nB CUBE – Center for Molecular\
    \ Bioengineering was founded as a Center for Innovation Competence within the\
    \ initiative “Unternehmen Region” of the German Federal Ministry of Education\
    \ and Research. It is part of the Center for Molecular and Cellular Bioengineering\
    \ (CMCB). B CUBE research focuses on the investigation of living structures on\
    \ a molecular level, translating the ensuing knowledge into innovative methods,\
    \ materials and technologies.\nWeb: www.tu-dresden.de/bcube\n\n \n\nAbout Leibniz\
    \ Institute for Solid State and Materials Research Dresden (IFW)\nThe IFW Dresden\
    \ is a legally independent, non-university research institution and member of\
    \ the Leibniz Association. The Institute’s mission is to explore the physics,\
    \ chemistry, and function of new materials and to generate innovations from new\
    \ discoveries. The focus is on the level of molecules, atoms, and electrons, which\
    \ are governed by the laws of quantum physics as well as nanotechnological laws.\n\
    Web: www.ifw-dresden.de\n\n \n\nAbout DRESDEN-concept\nDRESDEN-concept is the\
    \ research alliance of TU Dresden and local extramural research and cultural institutions.\
    \ A total of 33 partner institutions have joined forces in the association to\
    \ bundle synergies and jointly develop the Dresden science hub into a DRESDEN-concept\
    \ Science and Innovation Campus.\nThe acronym DRESDEN stands for Dresden Research\
    \ and Education Synergies for the Development of Excellence and Novelty and emphasizes\
    \ the focus of the collaboration: by networking across the boundaries of institutions\
    \ and subjects, DRESDEN-concept offers researchers an ideal place for science\
    \ and innovation.\nWeb: www.dresden-concept.de"
