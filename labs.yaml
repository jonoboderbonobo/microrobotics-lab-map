    students, mentor of 5 post-doctoral researchers, and 2 undergraduates. He has
    also given >100 invited/selected talks in national/international meetings/conferences/lectures.
    In 2010, he received the "Talent Prize in Science" awarded by the Portuguese Government
    (TV-broadcasted for more than 15 million people), in 2013 and 2014 he received
    the Young Researcher Award 2013 and was distinguished by the exceptional scientific
    productivity, respectively, by the Faculty of Pharmacy at the University of Helsinki,
    and in 2016 he was awarded the Academy of Finland Award for Social Impact. He
    has several national and international research collaborations in the areas of
    biomedical nano/micro-technology, controlled drug delivery, nanomedicine and cancer
    therapy, and innovative therapeutic modalities. He has acted as invited Guest
    Editor for Current Drug Discovery Technologies, Current Drug Metabolism, and Biomatter
    journals. He is also an active referee for about 50 international journals and
    evaluator for 5 international research foundations (e.g., Wellcome Trust, UK;
    European Science FOundation; The Leverhulme Trust, UK; Medical Research Council,
    UK; Research Foundation Flanders, Belgium; The Swiss National Science Foundation,
    Switzerland; The Netherlands Organisation for Scientific Research, The Netherlands;
    The Austrian Science Fund, Austria; and European Research Council (ERC)). Dr.
    Santos is also an Editorial Board Member for the journals of Drug Delivery Letters,
    Biomatter, International Journal of Nanotechnology and Nanoscience, World Journal
    of Pharmacology, Journal of Biopharmaceutics and Biotechnology, BioMed Research
    International, and he is an Associate Editor for Versita in the Chemistry field.
    He is also the Editor of a recently launched Mesoporous Biomaterials journal and
    an Editor of a book entitled "Porous Silicon for Biomedical Applications", Woodhead
    Publishing.


    Dr. Santos’ research career and development portfolio since 2009 totals over 10
    M€ (European Research Council H2020-MSCA-ITN-EJD, Academy of Finland, Tekes/Business
    Finland, CIMO, Biocentrum Helsinki, Finish Cultural Foundation, University of
    Helsinki Research Funds, etc.).



    Curriculum vitae


    Biography


    Dr. Hélder A. Santos (https://www.helsinki.fi/en/researchgroups/nanomedicines-and-biomedical-engineering)
    is a physical chemist specialized in electrochemistry, biological mimetic models
    and soft interfaces. In 2003, he obtained his MSc in Chemistry from the Department
    of Chemistry, University of Porto (Portugal). In 2007, he obtained his DSc in
    Chem. Eng. from the Laboratory of Physical Chemistry and Electrochemistry, Helsinki
    University of Technology (Finland, now named Aalto University). In 2007, Dr. Santos
    joined the University of Helsinki, Division of Pharmaceutical Technology, as a
    Postdoctoral Fellow. In 2009, he was appointed Academy of Finland Postdoctoral
    Research Fellow.


    Currently, he is a Full Professor in Biomedical Engineering and Head of Department
    of Biomedical Engineering, The University Medical Center Groningen/University
    of Groningen, The Netherlands. Former Full Prof. in Pharmaceutical Nanotechnology,
    at the University of Helsinki, Finland. Also, currently he is a Group Leader/Research
    Director and the Head of the Nanomedicines and Biomedical Engineering Group, Faculty
    of Pharmacy, University of Helsinki. He was also the Head of the Division of Pharmaceutical
    Chemistry and Technology, the Head of the Research Unit of Pharmaceutical Nanotechnology
    and Chemical Microsystems (NAMI), and former Head of the Preclinical Drug Formulation
    and Analysis Group. He is also the Director of the Doctoral Programme in Drug
    Research (2018-2021) and the Director of the FinPharmaNet (2020-2021). In 2013,
    Dr. Santos received the ERC starting grant for 2013-2017 worth of 1.5 M€ and an
    ERC PoC in 2019-2020.'
