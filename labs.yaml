  description: "Dr Anna C. Bakenecker has been awarded a LOEWE Start Professorship\
    \ at TU Darmstadt. The expert in medical physics is working on the development,\
    \ control and monitoring of nano- and microrobots that are designed to transport\
    \ drugs to their target sites in the body. The LOEWE research funding programme\
    \ of the state of Hesse is providing around two million euros over a period of\
    \ six years. \n\n\nWhen taking medication, less than one percent of the active\
    \ ingredient reaches the actual site of the disease. Often, for example in chemotherapy,\
    \ the whole body is affected, which can cause serious side effects. Anna C. Bakenecker\
    \ is researching how drugs can be targeted to their sites of action, where they\
    \ will only have a localised effect. To this end, she is developing tiny micro-\
    \ and nanorobots loaded with medication, which in the future can also be guided\
    \ through the body – for example to a tumour, an area of inflammation, or a vasoconstriction.\n\
    \nBakenecker uses biomaterials that enable triggered drug release and guides the\
    \ micro- and nanorobots with magnetic fields. In addition to guidance, precise\
    \ tracking of the tiny robots is essential for safe use in patients. To this end,\
    \ the medical physics expert and her team are researching a new type of tomographic\
    \ imaging modality: magnetic particle imaging. This field of research has great\
    \ potential for nanomedicine, as it allows regions of the body that are difficult\
    \ to access to be reached, and drugs to be targeted to their sites of action.\n\
    \n‘The associated progress for patients cannot be overestimated,’ said Hessian\
    \ Minister of Science Timon Gremmels. ‘I am very pleased that we have succeeded\
    \ in bringing Dr Bakenecker to Hesse with the LOEWE funding, thereby further expanding\
    \ our still young focus area in medical physics.’"
  interesting_work: null
  community_improvement: null
