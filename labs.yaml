  description: 'Welcome to the Soft and Micro Robotics Laboratory


    We aim to develop micro-scale robotic systems that can demonstrate insect-like
    locomotive capabilities in aerial, aquatic, and terrestrial environments. To design
    highly agile, multifunctional, and robust micro-scale robots, we work on (1) develop
    high bandwidth and robust soft actuators and active materials for locomotion and
    manipulation, (2) investigate and apply physical phenomena (surface tension, fluid-structure
    interaction, friction, electrostatics) at the millimeter scale in designing multifunctional
    robots, and (3) develop design and fabrication tools suitable for rapid prototyping
    of hybrid soft-rigid robots. We envision our work will find applications such
    as inspection, surgical robots, and environmental monitoring.


    Advising Statement


    At the Soft-and-Micro-Robotics Lab, we are committed to foster creativity, collaboration,
    and academic excellence among our students and post-doctoral researchers. We highly
    encourage collaborations among group members and with external teams to develop
    novel microscale robotic systems and applications. There is no hierarchical structure
    and each group member will directly discuss his/her/their research ideas and progress
    with the PI. We will create an independent project/task for each incoming student.
    As a student develops expertise in the field, we expect the student will identify
    novel and exciting directions and create and lead his/her/their own projects.
    In addition to having a weekly group meeting that discusses research ideas and
    literature studies, we will also set up a weekly or biweekly meeting with each
    group member.'
  notes: 'Migrated from the old hand-drawn uMap export. Campus outline in polygons/mit-smrl.geojson.
    Defaults applied pending review: relevance=1, status=watch, application=[] (empty).
