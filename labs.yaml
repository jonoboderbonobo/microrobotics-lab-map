    \ Research Center (DEMRC) was initially established for global collaboration on\
    \ microrobot research between DGIST and ETH Zurich. DEMRC plans to expand collaborations\
    \ with other domestic and international institutes. DEMRC has several government-funded\
    \ research projects including a major robotics project on industrial core technology\
    \ development funded by the Korea Evaluation Institute of Industrial Technologies\
    \ (KEIT) and the Ministry of Trade, Industry and Energy (MOTIE), Korea. The center\
    \ will pursue the project by developing new medical microrobots and minimally\
    \ invasive treatment technologies to cure chronic arterial occlusion with blocked\
    \ arteries. Furthermore, the center plans to develop core technology of microrobots\
    \ such as two and three-dimensional medical imaging, remote robot control for\
    \ minimal exposure to radiation and efficient chronic arterial occlusion treatment.\n\
    \n\n\n\n\nResearch Areas\n\n    Micro/nano-robots\n    Micro/nano manipulation\
    \ & control\n    Magnetic control systems\n    Piezoelectric micro-electro-mechanical\
    \ system (MEMS)\n    Materials for biomedical applications\n    Medical imaging\
    \ and surgical navigation\n    Microfluidics\n\n\nBio-Micro Robotics Lab. in Department\
    \ of Robotics Engineering\n\nOur research focus is on Micro-Electromechanical\
    \ Systems (MEMS) and Nano- Electromechanical Systems (NEMS) for robotics and biomedicine.\
    \ Current research activities in our group include micro-robots, micro/nano manipulation,\
    \ acoustic MEMS transducers, brain-machine interfaces, and microfluidics devices.\
    \ Potential applications for those research areas include minimally-invasive surgery,\
    \ drug/cell transportation within the human body, neural prostheses for artificial\
    \ sensory systems, medical communication, and ultrasonic medical imaging.\n\n\
    Research Areas\nDGIST-ETH Microrobotics Research Center and Biomicrorobotics Lab\
    \ is aiming to Micro/nano-robots, magnetic control systems and Piezoelectric micro-electro-mechanical\
    \ system for multidisciplinary research between biomedical and micro/nano technologies\n\
    \n\n\n\n\n    Creating a conducive research environment for interdisciplinary\
    \ micro-robotics studies and overcoming technological barriers in the field through\
    \ the advancement of related foundational research and securing fundamental patents.\n\
    \    Training globally competitive researchers in the field of micro-robotics\
    \ convergence.\n    Establishing partnerships with industry for technology transfer\
    \ related to micro-robotics and fostering collaboration between academia and industry\
    \ in research and development.\n    Building cooperative networks with leading\
    \ micro-robotics research institutions worldwide, ensuring international agility\
    \ and collaboration.\n\n\n\n\n\n    Development of applied technologies for medical\
    \ micro/nano robots\n        Development of biocompatible and highly efficient\
