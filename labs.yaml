  description: 'Über uns


    Eine steigende Lebenserwartung und eine niedrige Geburtenraten verändern die Bevölkerungsstruktur
    tiefgreifend. Der demografische Wandel gilt als eine der großen Herausforderungen
    der modernen Industriegesellschaft. Zu seinen Folgen zählen die zunehmende Knappheit
    an Nachwuchs- und Führungskräften, der Anstieg der Pflegebedürftigkeit und Finanzierungsschwierigkeiten
    der Sozialversicherungssysteme. Zentrales gesellschaftliches Ziel einer alternden
    Gesellschaft bleibt die Sicherung des Wohlstands. Das setzt die Aufrechterhaltung
    der Innovationsfähigkeit, die Verfügbarkeit von Arbeitskräften und die Anpassung
    der Institutionen an demografischen Veränderungen voraus. Wohlstand bedeutet auch,
    ein selbständiges und selbstbestimmtes Leben im Alter zu ermöglichen, in Gesundheit
    und mit voller gesellschaftlicher Teilhabe.


    Das Department Altern des Individuums und der Gesellschaft (AGIS) sucht hierfür
    nach neuen Lösungen – auf der Ebene der medizinischen Versorgungs- und Therapieformen,
    im Bereich der wirtschaftlichen und sozialen Strukturen und in Bezug auf technische
    Assistenzsysteme. Voraussetzung hierfür ist eine interdisziplinäre Forschung,
    die auf Erkenntnissen aus Medizin, Geisteswissenschaften und Ingenieurwissenschaften
    aufbaut.'
