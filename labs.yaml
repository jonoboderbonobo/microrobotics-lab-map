- id: srl-twente
  name: Surgical Robotics Lab (SRL)
  pi: Sarthak Misra
  institution: University of Twente
  city: Enschede
  country: NL
  lat: 52.23989
  lon: 6.849866
  osm: null
  url: https://surgicalroboticslab.nl/about/introduction/
  people_url: null
  category: micro-robotics
  application: [medical]
  min_dim_um: null
  onboard_power: false
  institution_type: university
  relevance: 4
  status: watch
  description: >
    The Surgical Robotics Lab (SRL) is part of the Department of Biomechanical
    Engineering (Faculty of Engineering Technology) at the University of
    Twente, The Netherlands. SRL is led by Prof. Sarthak Misra, and is also
    part of the Department of Biomaterials and Biomedical Technology at the
    University of Groningen and University Medical Center Groningen. SRL is
    affiliated with the MESA+ Institute, Technical Medical (TechMed) Centre,
    and PRECISION Institute.

    The lab designs a range of flexible minimally invasive surgical
    instruments and microrobotic systems, and robotically controls them using
    clinical imaging modalities such as ultrasound, computed tomography and
    magnetic resonance imaging. The team is multidisciplinary, spanning
    engineers, clinicians and industrial collaborators.

    Contact for student projects: info@surgicalroboticslab.nl
  notes: >
    Strong clinical-imaging control stack. Externally actuated and
    instrument-scale rather than sub-mm autonomous, so the micro-robotics
    label is generous -- revisit once min_dim_um is filled in. The polygon on
    the original map was the Twente campus; find the OSM way and set `osm`.

