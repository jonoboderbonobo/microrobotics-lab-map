  description: "Asset 2\nAsset 2\n\n2/3\nOur Research Mission and Vision\n​\n\nLife\
    \ as Inspiration for Adaptive, Autonomous and Interactive Systems and Materials.\
    \ What are the essential principles of life? How can we transduce these principles\
    \ to synthetic systems and materials to innovate for next generation of macromolecular\
    \ materials systems with unprecedented active and interactive properties? On a\
    \ molecular level, living systems are characterized by being organized in chemically\
    \ fueled out-of-equilibrium states that are regulated by signaling networks. This\
    \ results in a stunning richness of active properties such as self-regulation,\
    \ adaptation, communication, morphogenesis, self-replication and evolution. \n\
    \n​\n\nComplex (Macro)molecular Systems that Organize in Space and Time: Inspired\
    \ by these challenges, we dedicate our efforts on fueled and feedback-controlled\
    \ non-equilibrium self-assembling molecular systems that are regulated by signal-processing\
    \ chemical reaction networks (CRNs). We research such systems on a fundamental\
    \ system chemistry level and connect such CRNs to artifical cells, self-regulating\
    \ structures and soft materials research. At the core of our investigations is\
    \ the design and the synthesis of precision-engineered synthetic polymers, DNA\
    \ and colloids, as well as their hierarchically self-assembled systems.\n\n\n\
    Complexity as a Driver for Materials Innovation: Our philosophy is to go beyond\
    \ a quantitative understanding of structure formation processes, and we aim for\
    \ an analysis and exploitation of the resulting life-like systems on a functional\
    \ materials level to bridge the gap between fundamental research and first-time\
    \ applications. ​For life-like materials systems we focus on self-regulation,\
    \ adaptation, training, learning, morphogenesis, as well as communication and\
    \ co-evolution with biological systems as in the context of self-erasing hydrogels,\
    \ mechanosensing materials, mechanical metamaterials, soft robotics and interactive\
    \ biomaterials.\n​"
  interesting_work: null
  community_improvement: null
  mission_fit: Materials-lab entry migrated from an earlier map version -- specific
