  status: watch
  description: "Polo Sant'Anna Valdera\n\nresearch centre of Sant'Anna School of Advanced\
    \ Studies in Pisa \n\n\n\n\n\nThe Microscale Robotics Laboratory aims to create\
    \ advanced robotic technologies of sub-millimeter dimensions. Our approach is\
    \ based on bioinspire, and living cells are our source of inspiration for the\
    \ design of microrobots with advanced mobility and navigation capabilities. In\
    \ particular, we aim to translate the mechanisms of cellular mobility into new\
    \ designs of mobile microrobots, and to create microrobotic models to test hypotheses\
    \ on specific cellular behaviors (e.g. locomotion and migration of cells in body\
    \ tissues).\nBy leveraging these bioinspired designs, we will address the main\
    \ limitations of current microrobots and develop innovative microrobotic technologies\
    \ with high potential impact on minimally invasive medicine. In particular, we\
    \ want to equip microrobots with advanced robotic capabilities (e.g. autonomy),\
    \ achieving a whole new level of functionality that will open the doors to currently\
    \ unimaginable medical applications.\nIn an attempt to make advanced autonomous\
    \ microrobots, we will also study the intelligent behaviors that emerge in microscopic\
    \ physical systems. Our microrobots will have the ability to interact physically\
    \ and chemically with their surroundings, and complex behaviors will emerge (predictably\
    \ and programmable) from the complex interaction between the reactions of their\
    \ constituents to the environment. This will lead to a new bottom-up approach\
    \ to robotics and intelligent systems embodied.\n\nThe Microscale Robotics Laboratory\
    \ was established thanks to a European Research Council Starting Grant (ERC) under\
    \ the European Union’s Horizon 2020 research and innovation programme (CELLOIDS\
    \ project, GA: 948590)."
  notes: 'Migrated from the old hand-drawn uMap export. Campus outline in polygons/santanna-palagi.geojson.
    Defaults applied pending review: relevance=1, status=watch, application=[] (empty).
    institution_type set from general knowledge (not the export) -- verify. onboard_power
    defaulted to false -- verify. ''Stefano Palagi – SantAnna Pisa'' was a near-duplicate
    of the same lab with near-identical description text but a point ~230km away (near
    Padova, not Pisa) -- looks like a stray pin placement in the old map. Merged into
    one entry using the Pontedera/Pisa coordinates.'
