  description: "Mission Statement\nStrategic positioning:\n\n    Orientating towards\
    \ National Strategy intents and frontiers of disciplines\n\n    Keeping a foothold\
    \ on the fundamental research and its application of fluid power\n\n    Exploiting\
    \ trans-disciplinary fields with fluid power including electron, Informatics,\
    \ Control Science and bioscience\n\n    Solving problems of basic theory and key\
    \ technology on Fluid Power and Mechatronic Systems\n\n    Supporting state economy\
    \ and social development\n\n\nDevelopment Target:\n\n    Raising and developing\
    \ innovative theory, principle and method\n\n    Solving science problems and\
    \ key technology\n\n    Developing prototype machines and integrated systems\n\
    \n    Realizing technology transformation\n\n\nWe are trying to be—\n\n    A platform\
    \ for high-level fundamental and application research in this field\n\n    A platform\
    \ for cultivating and gathering top-talents as well as carrying out high-level\
    \ academic exchanges\n\n    A platform for promoting technology application and\
    \ industrial development in this field\n\n\n\n\n\nAbout Prof. Sun Yu:\n\nAbstract:\n\
    Micro-nano operating robots are a relatively young area of research. After 30\
    \ years of experience in this field, the basic physics problems related to micro-nano\
    \ operations have been well understood and solved. The development of micro-nano-scale\
    \ sensor triggering and control technology, systems and tools has also developed\
    \ rapidly. This report begins with a brief history of the development of micro-nano\
    \ operating robots, describing micro-nano-scale sensing, triggering techniques,\
    \ analysis of microscopic vision and micro-Nanoton force feedback control methods\
    \ (eg how to use 2D microscopic vision to obtain accurate 3D) Information; how\
    \ to perform robot path planning for large deformation objects operating on micro-nano\
    \ scales, and robotic micro-operation techniques based on sound field, magnetic\
    \ field, and light field. Finally, the typical application cases of micro-manipulation\
    \ robot technology in the past ten years are introduced, for example Nanomanipulators\
    \ for the operation and measurement of single triodes and nanomaterials, precision\
    \ robotic surgery, tumor delivery and therapy, and robotic cell surgery applications\n\
    \n\nBio:\n\n\n   Yu Sun is a Professor in the Department of Mechanical and Industrial\
    \ Engineering, with joint appointments in the Institute of Biomaterials and Biomedical\
    \ Engineering, the Department of Electrical and Computer Engineering, and the\
    \ Department of Computer Science at the University of Toronto (UofT). He is a\
    \ Tier I Canada Research Chair, and the founding Director of the UofT Robotics\
    \ Institute. His Advanced Micro and Nanosystems Laboratory specializes in developing\
    \ innovative technologies and instruments for manipulating and characterizing\
    \ cells, molecules, and nanomaterials. He was elected Fellow of ASME (American\
    \ Society of Mechanical Engineers), IEEE (Institute of Electrical and Electronics\
    \ Engineers), AAAS (American Association for the Advancement of Science), NAI\
    \ (US National Academy of Inventors), CAE (Canadian Academy of Engineering), and\
    \ RSC (Royal Society of Canada) for his work on micro-nano devices and robotic\
    \ systems.\n\n    Sun obtained his Ph.D. from the University of Minnesota in 2003\
    \ and did his postdoctoral research at ETH-Zürich. He joined the University of\
    \ Toronto in 2004. In 2012-2013, he directed the University Nanofabrication Center\
    \ as the faculty director. Sun has served and serves on the editorial boards of\
    \ IEEE Trans. Robotics, IEEE Trans. Automation Science and Engineering, IEEE Trans.\
    \ Mechatronics, J. Micromechanics Microengineering, Sensors and Actuators A: Physical,\
    \ Scientific Reports, and Microsystems & Nanoengineering. Among the awards he\
    \ received were the IEEE Robotics and Automation Society Early Career Award; over\
    \ a dozen best paper awards and finalists at major international conferences;\
    \ seven times University of Toronto Connaught Innovation Award; the McLean Award;\
    \ the First Prize in Technical Achievement of ASRM (American Society for Reproductive\
    \ Medicine); an NSERC E.W.R. Steacie Memorial Fellowship; and the IEEE C.C. Gotlieb\
    \ Computer Award."
