    \ multidisziplinären - internationalen wie nationalen - Forschungsprojekten auf\
    \ den Gebieten der flexiblen Mikro- und Nanorobotik sowie der automatisierten\
    \ Nanohandhabung und Nanocharakterisierung zurückgreifen, wobei die meisten Verbundprojekte\
