    \ robots differ fundamentally from traditional robots. They are biologically inspired\
    \ and instead of relying on a rigid joint-link composition, continuum robots are\
    \ organic compliant structures.\nTheir appearance is evocative of animals and\
    \ organs such as trunks, tongues, worms, jellyfish, and snakes. Continuum robots\
    \ are composed of flexible, elastic, or soft materials such that they can exhibit\
    \ complex bending motions and appear with curvilinear shapes.\nOur scientific\
    \ methods contribute to the general understanding of continuum robots at the system\
    \ level and facilitate the development of continuum robots for various areas of\
