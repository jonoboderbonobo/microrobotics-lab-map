  description: "Welcome to our laboratory! The Demirci Bio-Acoustic MEMS in Medicine\
    \ Labs (BAMM) laboratory specializes in applying micro- and nanoscale technologies\
    \ to problems in medicine at the interface between micro/nanoscale engineering\
    \ and medicine. We apply innovative technologies to clinical problems. Our major\
    \ research theme focuses on creating new microfluidic technology platforms targeting\
    \ broad applications in medicine. In this interdisciplinary space at the convergence\
    \ of engineering, biology and materials science, our goal is to create novel technologies\
    \ for disposable point-of-care (POC) diagnostics and monitoring of infectious\
    \ diseases, cancer and controlling cellular microenvironment in nanoliter droplets\
    \ for biopreservation and microscale tissue engineering applications. These applications\
    \ are unified around our expertise to test the limits of cell manipulation by\
    \ establishing microfluidic platforms to provide solutions to real world problems\
    \ at the clinic.\n\nOur lab creates technologies to manipulate cells in nanoliter\
    \ volumes to enable solutions for real world problems in medicine including applications\
    \ in infectious disease diagnostics and monitoring for global health, cancer early\
    \ detection, cell encapsulation in nanoliter droplets, and bottom-up tissue engineering.\
    \ Our research interests involve applications of microfluidics and acoustics in\
    \ medicine, especially: microfluidics for inexpensive, disposable viral load devices\
    \ for HIV in resource-constrained settings for global health; 3-D bioprinting\
    \ and tissue models including cancer and neural cultures.\n\nWe welcome your feedback!\
    \ Please feel free to send your comments to utkan@stanford.edu\n\n. We are part\
    \ of the Canary Center at Stanford for Cancer Early Detection, a world-class research\
    \ facility dedicated to cancer early detection programs. \n\nhttps://canarycenter.stanford.edu/aboutus.html"
