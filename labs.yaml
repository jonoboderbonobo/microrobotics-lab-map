  description: 'The Multi-Scale Robotics Lab (MSRL) pursues a dynamic research program
    that maintains a strong robotics research focus on several emerging areas of science
    and technology. A major component of the MSRL research leverages advanced robotics
    for creating intelligent machines that operate at micron and nanometer scales.
    MSRL research develops the tools and processes required to fabricate and assemble
    micron sized robots and nanometer scale robotic components. Many of these systems
    are used for robotic exploration within biomedical and biological domains.

    The MSRL pursues a balanced agenda between fundamental and applied research. The
    lab consistently publishes highly cited papers in top journals while also driving
    significant industrial interactions. The ground breaking technologies developed
    at MSRL have also led to the formation of several startup companies.

    '
  notes: 'Largest and most visible group in the field, and the main source of the
    "microrobot" terminology this map is trying to be precise about. Most systems
    are externally actuated, so by the strict criterion this is closer to a material
    lab -- but the systems-level ambition and the startup track record justify micro-robotics.
    Worth pinning down min_dim_um for their smallest genuinely untethered device.

