    The department aims to understand the underlying principles of physical intelligence
    of single and collectives of biological organisms at milli- and micrometer length
    scales, and realize advanced physical intelligence capabilities on small-scale
    mobile robots using such principles. As the societal and translational research
    mission, the team aims to apply these tiny robots as minimally invasive and implantable
    wireless medical robots inside our body to revolutionize medicine and healthcare.
