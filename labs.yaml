    \ Informatik.\n\nIn vielen Anwendungsgebieten sind Roboter erforderlich, die kleinste\
    \ Objekte mit einer Genauigkeit im Nanometerbereich handhaben können. Die besten\
    \ Beispiele sind die Mikrosystemtechnik und die Nanotechnologie. Flexible, modulare\
