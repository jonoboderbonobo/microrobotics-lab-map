  relevance: 1
  status: watch
  human_reviewed: false
  description: 'Vision des Departments LL&M


    ... ist es, durch die Verbindung von Light on Matter, Matter at the Nanoscale
    und Cells in Contact, das Small Scale Sensing zu fördern. Wir entwickeln innovative
    Methoden, um diese Bereiche zu erforschen und leisten so einen bedeutenden Beitrag
    zur Bewältigung globaler Herausforderungen.




    Hintergründe


    Im Jahr 2007 gründete die Universität Rostock das Department "Science and Technology
    of Life, Light and Matter" (LL&M), um eine Verbindung zwischen den Natur-, Ingenieur-
    und Lebenswissenschaften herzustellen. Diese Initiative sollte die Zusammenarbeit
    verschiedener Fachbereiche und Fakultäten fördern und innovative Forschung im
    Bereich Lebenswissenschaften vorantreiben.


    LL&M ist Teil der Interdisziplinären Fakultät (INF), zu der neben LL&M drei weitere
    Departments gehören: Maritime Systeme, Altern des Individuums und der Gesellschaft
    (seit 2007) sowie Wissen-Kultur-Transformation (seit 2010). Diese Struktur ermöglicht
    es, komplexe wissenschaftliche Herausforderungen aus verschiedenen Blickwinkeln
    zu betrachten und zu lösen.


    Das Department hat eine positive Resonanz von Persönlichkeiten der Universität
    Rostock erhalten, was seine Bedeutung in der akademischen Gemeinschaft unterstreicht.
    Derzeit engagieren sich 49 Mitglieder aus verschiedenen Fakultäten der Universität
    Rostock sowie aus Forschungseinrichtungen wie den Leibniz-Instituten für Atmosphärenphysik
    und Katalyse, dem Institut für Ostseeforschung und der Schweißtechnischen Lehr-
    und Versuchsanstalt MV in LL&M.


    Zusätzlich unterhält LL&M eininterdisziplinäres Graduiertennetzwerk, das darauf
    abzielt, den wissenschaftlichen Nachwuchs zu fördern. In diesem Netzwerk sind
    derzeit zahlreiche Kollegiatinnen und Kollegiaten aktiv, die von der Vielfalt
    des Departments profitieren und eine interdisziplinäre Weiterbildung erhalten.
    Einmal im Jahr kommen diese Jungwissenschaftlerinnen und Jungwissenschaftler zusammen,
    um ihre Forschungsprojekte vorzustellen, Erfahrungen auszutauschen und sich über
    die traditionellen Fächergrenzen hinweg zu vernetzen.

    Zielsetzung


    Das Department Leben, Licht und Materie (LLM) vernetzt Forschungsschwerpunkte
    in den Natur-, Ingenieur- und Lebenswissenschaften und kooperiert eng mit den
    Fakultäten. Im Department LLM werden interdisziplinäre Fragestellungen aus den
    Nanowissenschaften, den Materialwissenschaften, der biomedizinischen Implantattechnologie,
    der Biophysik und der Photonik bearbeitet. Mit den Themenbereichen Light on Matter,
    Matter at the Nanoscale sowie Cells in Contact verfolgen wir die Leitlinie, fundamentale
    Prozesse auf atomarer und molekularer Ebene zu analysieren, zu verstehen und zu
    steuern. Diese Bereiche ermöglichen die Entwicklung innovativer Sensoren, wobei
    Nanomaterialien und Quanteneffekte das Potenzial für zukünftige Miniaturisierung
    bieten.


    Grundlage für diese Forschung in LLM ist der eigene Forschungsbau, der Kompetenzzentren(Kalorimetrie,
    Oberflächen/Grenzflächen, Kernspinresonanzspektroskopie, Massenspektrometrie,
    Mikroskopie/Spektroskopie), weitere Großgeräte sowie das Elektronenmikroskopie
    Zentrum (ELMI-MV) beherbergt. Damit unterstützt das Department die internationalen
    Forschungsverbünde wie zum Beispiel die SFBs Elaine und LiMatI.


    Langfristig wird eine internationale Spitzenposition in der Nano-Sensorik angestrebt.
    Dazu werden neue Techniken zur Mikro- und Nanostrukturierung von Oberflächen und
    Volumina entwickelt. Grundvoraussetzung hierfür ist die Kenntnis der verwendeten
    Materie auf der Nanoebene, wofür Licht-, Elektronen- und Quantentechniken eingesetzt
    werden.'
