  human_reviewed: false
  description: "Dandan Zhang\nThe Multi-Scale Embodied Intelligence Lab focuses on\
    \ developing embodied intelligence across multiple scales, ranging from micro/nanobots\
    \ to large-scale robotic systems, primarily targeting healthcare applications.\n\
    \nResearch Themes\n\n​\n\n    Multimodal Perception (Sensing)\n\n    Interactive\
    \ Learning (Decision-Making)\n\n    Dexterous Manipulation（Execution)\n\n\n\n\
    Research Objectives\n\n \n\nWe aim to embed embodied intelligence in large-scale\
    \ robots, including medical robotics for surgeries to assistive robotics for homecare\
    \ applications. We also explore micro-robotic innovations at the cellular scale,\
    \ including developing microsurgical tools for precise micro-manipulation. Beyond\
    \ individual scales, we also explore how these multi-scale robotic systems can\
    \ integrate and interface with each other, ensuring seamless operations across\
    \ dimensions.\n\n\nThe ultimate goal is to develop the next-generation robots\
    \ empowered by artificial intelligence with super-human capabilities. We envision\
    \ that intelligent robots will reshape our world by providing tangible benefits\
    \ in our daily life, contributing to the healthcare system or assisting humans\
    \ in hazardous environments. \n\n\nResearch Vision\n\n​\n\nEmbodied intelligence\
    \ is a crucial concept for the autonomy and adaptivity of systems operating in\
    \ a physical world that is evidently uncertain and complex. Although advancements\
    \ in Artificial Intelligence (AI) have given rise to general-purpose intelligent\
    \ agents, the intricate and unpredictable nature of the real world demands robots\
    \ that do more than just ‘think’ based on computational intelligence. Robots must\
    \ be able to precisely 'perceive' and dynamically ‘act’ to adapt to different\
    \ scenarios through direct interactions with their environments. To this end,\
    \ our work focuses on creating and manipulating intelligent robots that can function\
    \ efficiently in varied environments.\n\n\nTargets\n\n    Enable seamlessly human-robot\
    \ shared control\n\n    Enhance the level of autonomy for multi-scale robotics\
    \ systems\n\nApplications\n\n    Medical Robotics\n\n    Homecare Robotics\n\n\
    \    Assistive Robotics\n\n\nMy major research interests lie at the intersection\
    \ of robotics and machine learning. I envision that intelligent robots will reshape\
    \ our world by providing tangible benefits in our daily life, contributing to\
    \ the healthcare system, or assisting humans in hazardous environments. In addition,\
    \ I also work on micro-robotics, teleoperation, and human-robot shared control.\
    \  \n\n​\n\nMedical robots and instruments are expected to be smaller, and smarter\
    \ for wider clinical uptake. Intelligent robotic platforms and accurate micromanipulation\
    \ techniques are worth developing since they can empower operators with superhuman\
    \ capabilities as well as reduce their physical workload during repetitive and\
    \ tedious micro-surgical tasks. Despite continuous technical evolution in this\
    \ research area, many challenges remain. For micromanipulation platforms that\
    \ can conduct surgery in the microscale, it’s challenging to enable precise perception\
    \ of the micro-tools and dexterous manipulation in 3D space. Therefore, new control\
    \ strategies and vision techniques are worth exploring. To develop smarter robotic\
    \ platforms, machine learning techniques can be incorporated into the control\
    \ scheme. Therefore, it’s worthwhile to combine control commands generated by\
    \ human operators and machine learning-based autonomous control to enable efficient\
    \ human-robot shared control for surgical operations. This leads to the development\
    \ of intelligent surgical robots to assist human operators in robotic surgery."
